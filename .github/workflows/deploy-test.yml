name: Deploy to test

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy bundle to test
    runs-on: ubuntu-latest
    environment: TEST

    env:
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: https://adb-7405605185991044.4.azuredatabricks.net
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_user_email: ${{ secrets.DATABRICKS_USER_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy bundle to test
        run: databricks bundle deploy --target test

      - name: Run pipeline congigurations workflow (pipeline + rls/cls + policies)
        run: |
          databricks bundle run Chocolate_Sales_Setup_Workflow \
            --target test

      - name: Print deployment summary
        if: always()   # run even if previous steps failed, for debugging
        run: databricks bundle summary --target test
