bundle:
  name: my_project
  uuid: 2ac4c92b-9da5-4c15-9731-c134acf921cf

include:
  - resources/*.yml

variables:
  catalog:
    description: The catalog to use
    default: dbr_dev
  schema:
    description: The schema to use
    default: liebiedieva_bronze
  dev_flag:
    default: false
  user_email:
    description: Email for alerts
    default: ${workspace.current_user.userName} #will be overwritten during deployment to test, since service principal is used

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net
      root_path: /Workspace/Users/${var.user_email}/lab7/${bundle.name}/${bundle.target}
    variables:
      catalog: dbr_dev
      dev_flag: true

  test:
    mode: production
    workspace:
      host: https://adb-7405605185991044.4.azuredatabricks.net
      root_path: /Workspace/Users/${var.user_email}/lab7/${bundle.name}/${bundle.target}
    variables:
      catalog: liebiedieva_test
    presets:
      name_prefix: '[testing] '
    permissions:
      - group_name: data_engineers
        level: CAN_MANAGE
      - service_principal_name: 58b448c4-3ec2-4e48-b986-de61521b8d89
        level: CAN_MANAGE
    run_as:
      service_principal_name: 58b448c4-3ec2-4e48-b986-de61521b8d89
