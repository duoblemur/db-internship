resources:
  alerts:
    zero_ingestion:
      display_name: "Zero_Ingestion_Alert"
      warehouse_id: a1f04664c7fcffa4
      query_text: |
        SELECT COUNT(*) AS today_count
        FROM ${var.catalog}.liebiedieva_gold.fact_sales
        WHERE date_key = CAST(DATE_FORMAT(CURRENT_DATE(), 'yyyyMMdd') AS INT)

      evaluation:
        comparison_operator: EQUAL
        source:
          name: today_count
        threshold:
          value:
            double_value: 0.0
        notification:
          notify_on_ok: true
          retrigger_seconds: 86400
          subscriptions:
            - user_email: ${var.user_email}
 
      schedule:
        quartz_cron_schedule: "0 30 8 * * ?"  # 08:30 UTC daily
        timezone_id: "UTC"
        pause_status: PAUSED
 
      permissions:
        - level: CAN_MANAGE
          group_name: data_engineers
